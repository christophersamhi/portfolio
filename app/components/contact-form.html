<div class="contact-form">
    <button class="contact-form__open" aria-expanded="false" aria-label="Ouvrir le formulaire" aria-controls="contact-form-modal">
        nous contacter
    </button>
    <div id="contact-form-modal" class="contact-form__hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="contact-form-title">
        <button class="contact-form__close" aria-label="Fermer le formulaire">
        </button>
        <div class="contact-form__hidden__container">   
            <span class="contact-form__hidden__title" id="contact-form-title">Nous contacter</span>
            <form>
                <div class="contact-form__item">
                    <label for="nom" class="sr-only">Nom</label>
                    <input id="nom" type="text" name="nom" placeholder="Nom" autocomplete="name" required>
                </div>
                <div class="contact-form__item">
                    <label for="email" class="sr-only">Email</label>
                    <input id="email" type="email" name="email" placeholder="Email" autocomplete="email" required>
                </div>
                <div class="contact-form__item">
                    <label for="telephone" class="sr-only">Numéro de téléphone</label>
                    <input id="telephone" type="tel" name="telephone" placeholder="Téléphone" autocomplete="tel">
                </div>
                <div class="contact-form__item">
                    <label for="entreprise" class="sr-only">Entreprise</label>
                    <input id="entreprise" type="text" name="entreprise" placeholder="Entreprise" autocomplete="organization">
                </div>
                <div class="contact-form__item">
                    <label for="service">Service</label>
                    <div class="select-wrapper">
                        <select id="service" name="service" required>
                            <option value="" disabled selected>Choisir une option</option>
                            <option value="contact">Contact</option>
                            <option value="devis">Demande de devis</option>
                            <option value="support">Support</option>
                            <option value="autre">Autre</option>
                        </select>
                    </div>
                </div>
                <div class="contact-form__item">
                    <label for="objet" class="sr-only">Objet</label>
                    <input id="objet" type="text" name="objet" placeholder="Objet" required>
                </div>
                <div class="contact-form__item">
                    <label for="message">Votre message</label>
                    <textarea id="message" name="message" placeholder="" rows="7" required></textarea>
                </div>
                <div class="contact-form__item">
                    <input id="consentement" type="checkbox" name="consentement" required>
                    <label for="consentement">
                        J’accepte que mes données soient utilisées pour être recontacté
                    </label>
                </div>
                <button type="submit" class="cta" aria-label="Envoyer le formulaire">Envoyer</button>
            </form>
        </div>
    </div>
</div>
